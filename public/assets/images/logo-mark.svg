<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Deep Oxford Navy Gradients -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1d36" />
      <stop offset="50%" stop-color="#091324" />
      <stop offset="100%" stop-color="#040811" />
    </linearGradient>

    <radialGradient id="radialGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#0f1d36" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#040811" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Depth and Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="gearShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Base -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Crest Contour -->
    <path d="M 256 22 
             C 382 22, 464 70, 474 176 
             C 484 312, 378 424, 256 490 
             C 134 424, 28 312, 38 176 
             C 48 70, 130 22, 256 22 Z" 
          fill="url(#navyBg)" 
          stroke="url(#goldLinear)" 
          stroke-width="10" 
          stroke-linejoin="round" />

    <!-- Inner Radial Glow -->
    <path d="M 256 36 
             C 370 36, 448 78, 458 176 
             C 468 300, 368 408, 256 472 
             C 144 408, 44 300, 54 176 
             C 64 78, 142 36, 256 36 Z" 
          fill="url(#radialGlow)" />

    <!-- Inner Inset Gold Pinstripe -->
    <path d="M 256 44 
             C 364 44, 440 82, 450 178 
             C 458 296, 362 398, 256 462 
             C 150 398, 54 296, 62 178 
             C 72 82, 148 44, 256 44 Z" 
          fill="none" 
          stroke="url(#goldAccent)" 
          stroke-width="2.5" 
          stroke-opacity="0.75" />
  </g>

  <!-- Campus Architecture Pediment & Dome (Top Apex) -->
  <g id="campus-pediment">
    <!-- Top Spire / Finial -->
    <path d="M 256 50 L 260 76 L 252 76 Z" fill="url(#goldLinear)" />
    <circle cx="256" cy="48" r="4.5" fill="#fef08a" />

    <!-- University Dome Profile -->
    <path d="M 228 106 C 228 78, 284 78, 284 106 Z" fill="url(#goldLinear)" />
    <!-- Dome Base Band -->
    <rect x="222" y="106" width="68" height="6" rx="2" fill="url(#goldLight)" />

    <!-- Triangular Portico Pediment -->
    <path d="M 256 102 L 374 152 L 138 152 Z" fill="url(#navyBg)" stroke="url(#goldLinear)" stroke-width="4" stroke-linejoin="round" />
    <polygon points="256,112 354,148 158,148" fill="url(#goldAccent)" fill-opacity="0.25" />

    <!-- Pediment Lintel Beam -->
    <rect x="130" y="152" width="252" height="12" rx="2" fill="url(#goldLinear)" />
  </g>

  <!-- Stately Pillars & Interlocking "H" Architecture -->
  <g id="interlocking-h-pillars">
    <!-- LEFT PILLAR (Left Leg of 'H') -->
    <!-- Column Capital -->
    <path d="M 148 164 L 206 164 L 200 178 L 154 178 Z" fill="url(#goldLinear)" />
    <!-- Pillar Shaft -->
    <rect x="156" y="178" width="42" height="172" rx="3" fill="url(#goldLight)" />
    <!-- Vertical Fluting Highlights -->
    <line x1="166" y1="184" x2="166" y2="344" stroke="#78350f" stroke-width="2" stroke-opacity="0.55" />
    <line x1="177" y1="184" x2="177" y2="344" stroke="#ffffff" stroke-width="2" stroke-opacity="0.65" />
    <line x1="188" y1="184" x2="188" y2="344" stroke="#78350f" stroke-width="2" stroke-opacity="0.55" />
    <!-- Column Base Plinth -->
    <path d="M 152 350 L 202 350 L 208 362 L 146 362 Z" fill="url(#goldLinear)" />

    <!-- RIGHT PILLAR (Right Leg of 'H') -->
    <!-- Column Capital -->
    <path d="M 306 164 L 364 164 L 358 178 L 312 178 Z" fill="url(#goldLinear)" />
    <!-- Pillar Shaft -->
    <rect x="314" y="178" width="42" height="172" rx="3" fill="url(#goldLight)" />
    <!-- Vertical Fluting Highlights -->
    <line x1="324" y1="184" x2="324" y2="344" stroke="#78350f" stroke-width="2" stroke-opacity="0.55" />
    <line x1="335" y1="184" x2="335" y2="344" stroke="#ffffff" stroke-width="2" stroke-opacity="0.65" />
    <line x1="346" y1="184" x2="346" y2="344" stroke="#78350f" stroke-width="2" stroke-opacity="0.55" />
    <!-- Column Base Plinth -->
    <path d="M 310 350 L 360 350 L 366 362 L 304 362 Z" fill="url(#goldLinear)" />

    <!-- STRUCTURAL CROSSBAR (Bridge of 'H') -->
    <rect x="198" y="244" width="116" height="30" rx="3" fill="url(#navyBg)" stroke="url(#goldLinear)" stroke-width="3.5" />
    <line x1="202" y1="259" x2="310" y2="259" stroke="url(#goldAccent)" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Center Facility Management Emblem: Precision Engineering Gear & Maintenance Star -->
  <g id="facility-gear-star" filter="url(#gearShadow)">
    <!-- 8-Teeth Precision Industrial Gear -->
    <g transform="translate(256, 259)">
      <!-- Outer Gear Body -->
      <path d="
        M -12 -58 L 12 -58 L 15 -47 L 29 -41 L 41 -49 L 58 -32 L 49 -19 L 47 -4 L 58 12 L 49 29 L 41 19 L 29 41 L 49 41 L 32 58 L 19 49 L 4 47 L -12 58 L -12 58 L -15 47 L -29 41 L -41 49 L -58 32 L -49 19 L -47 4 L -58 -12 L -49 -29 L -41 -19 L -29 -41 L -49 -41 L -32 -58 L -19 -49 L -4 -47 Z"
        fill="url(#goldLinear)"
        stroke="#78350f"
        stroke-width="1.5" />

      <!-- Inner Gear Recess Circle -->
      <circle cx="0" cy="0" r="36" fill="url(#navyBg)" stroke="url(#goldLight)" stroke-width="3" />

      <!-- Core Maintenance Wrench & Spark Keystone -->
      <g id="central-symbol">
        <!-- 4-Point Facility Excellence Star -->
        <path d="M 0 -26 
                 C 2 -10, 10 -2, 26 0 
                 C 10 2, 2 10, 0 26 
                 C -2 10, -10 2, -26 0 
                 C -10 -2, -2 -10, 0 -26 Z" 
              fill="url(#goldAccent)" />

        <circle cx="0" cy="0" r="5" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Architectural Foundation Steps / Pedestal Plinth -->
  <g id="foundation-steps">
    <!-- Top Step -->
    <rect x="126" y="364" width="260" height="11" rx="2" fill="url(#goldLinear)" />
    <!-- Middle Step -->
    <rect x="108" y="377" width="296" height="11" rx="2.5" fill="url(#goldLight)" />
    <!-- Foundation Base Step -->
    <rect x="90" y="390" width="332" height="13" rx="3" fill="url(#goldLinear)" />
  </g>

  <!-- Classical Laurel Wreath Flanking Base -->
  <g id="laurel-wreath" fill="url(#goldAccent)" opacity="0.9">
    <!-- Left Wreath Leaf Clusters -->
    <path d="M 106 332 C 86 312, 78 280, 80 252 C 84 274, 96 294, 114 306 Z" />
    <path d="M 94 366 C 72 344, 62 310, 66 278 C 72 302, 86 324, 104 338 Z" />
    <path d="M 124 394 C 100 376, 82 344, 82 312 C 90 334, 108 356, 134 368 Z" />
    <path d="M 160 422 C 132 406, 108 376, 104 344 C 116 366, 138 388, 168 398 Z" />
    <path d="M 204 444 C 174 432, 146 406, 136 376 C 150 396, 176 414, 210 422 Z" />

    <!-- Right Wreath Leaf Clusters -->
    <path d="M 406 332 C 426 312, 434 280, 432 252 C 428 274, 416 294, 398 306 Z" />
    <path d="M 418 366 C 440 344, 450 310, 446 278 C 440 302, 426 324, 408 338 Z" />
    <path d="M 388 394 C 412 376, 430 344, 430 312 C 422 334, 404 356, 378 368 Z" />
    <path d="M 352 422 C 380 406, 404 376, 408 344 C 396 366, 374 388, 344 398 Z" />
    <path d="M 308 444 C 338 432, 366 406, 376 376 C 362 396, 336 414, 302 422 Z" />
  </g>

  <!-- Bottom Arch Banner: "HEADWORLD" Gold Script Band -->
  <g id="bottom-ribbon">
    <path d="M 170 430 Q 256 454 342 430 L 334 452 Q 256 474 178 452 Z" 
          fill="url(#goldLinear)" 
          stroke="#78350f" 
          stroke-width="1.5" />
    <text x="256" y="449" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="900" 
          letter-spacing="3" 
          fill="#0a1324">CAMPUS FACILITY</text>
  </g>
</svg>
